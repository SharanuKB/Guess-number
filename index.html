<!DOCTYPE html>
<html>
<head>

    <title>Guess Number Game</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="box">

        <h1> Guess The Number </h1>

        <p class="range">Guess Number Between 1 to 100</p>

        <form method="POST">

            <input
                type="number"
                name="guess"
                min="1"
                max="100"
                placeholder="Enter Number"
                required
            >

            <button type="submit">check</button>

        </form>

        <div class="message">
            {{ message }}
        </div>

    </div>

</body>
</html>
